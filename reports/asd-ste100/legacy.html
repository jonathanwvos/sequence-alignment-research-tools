<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>VALA literature reports</title>
  <style>
    :root {
      --ink: #18211c;
      --muted: #68726c;
      --paper: #fffdf8;
      --line: #d3dbd3;
      --accent: #175c45;
      --accent-soft: #dcebe4;
      --approved: #18794e;
      --approved-soft: #dff3e8;
      --rejected: #a33a31;
      --rejected-soft: #f7e4e1;
      --uncertain: #9a650d;
      --uncertain-soft: #f8edcf;
      --future-work: #4e55a5;
      --future-work-soft: #e8e8f8;
      --phase-1: #1769aa;
      --phase-1-soft: #e1effa;
      --phase-2: #76519b;
      --phase-2-soft: #eee7f5;
      --phase-3: #59636d;
      --phase-3-soft: #e9edf0;
      --priority-low: #59636d;
      --priority-low-soft: #e9edf0;
      --priority-medium: #9a650d;
      --priority-medium-soft: #f8edcf;
      --priority-high: #a33a31;
      --priority-high-soft: #f7e4e1;
      --shadow: 0 18px 50px rgba(30, 49, 39, .10);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.92), transparent 28rem),
        linear-gradient(135deg, #e5ece7 0%, #eef0e7 100%);
      font: 16px/1.62 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, select { font: inherit; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(24, 33, 28, .13);
      background: rgba(245, 248, 243, .92);
      backdrop-filter: blur(16px);
    }

    .header-inner {
      width: min(1400px, calc(100% - 32px));
      margin: 0 auto;
      padding: 14px 0 12px;
    }

    .masthead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 11px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .brand strong {
      color: var(--accent);
      font: 800 1.18rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .12em;
    }

    .brand span, .counter {
      color: var(--muted);
      font-size: .84rem;
      letter-spacing: .03em;
    }

    .collection-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 11px;
      padding: 4px;
      width: fit-content;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .68);
    }

    .collection-tab {
      min-height: 34px;
      padding: 0 13px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: .84rem;
      font-weight: 750;
    }

    .collection-tab:hover { color: var(--ink); }
    .collection-tab.is-active {
      color: var(--accent);
      background: #fff;
      box-shadow: 0 1px 4px rgba(24, 33, 28, .12);
    }

    .collection-tab:focus-visible {
      outline: 3px solid rgba(23, 92, 69, .24);
      outline-offset: 2px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: auto minmax(240px, 1fr) auto auto auto auto auto;
      align-items: center;
      gap: 8px;
    }

    .nav-button, .status-button, .phase-button, .priority-button, select {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: #fff;
      box-shadow: 0 1px 1px rgba(0,0,0,.03);
    }

    .nav-button, .status-button, .phase-button, .priority-button {
      cursor: pointer;
      padding: 0 14px;
      font-weight: 700;
    }

    .nav-button:hover, .status-button:hover, .phase-button:hover, .priority-button:hover, select:hover { border-color: #9eaaa2; }
    .nav-button:focus-visible, .status-button:focus-visible, .phase-button:focus-visible, .priority-button:focus-visible, select:focus-visible {
      outline: 3px solid rgba(23, 92, 69, .24);
      outline-offset: 2px;
    }

    select {
      width: 100%;
      padding: 0 38px 0 12px;
      text-overflow: ellipsis;
    }

    .sort-order { min-width: 155px; }

    .status-button {
      min-width: 150px;
      border-color: currentColor;
    }

    .status-button[data-status="approved"] { color: var(--approved); background: var(--approved-soft); }
    .status-button[data-status="rejected"] { color: var(--rejected); background: var(--rejected-soft); }
    .status-button[data-status="uncertain"] { color: var(--uncertain); background: var(--uncertain-soft); }
    .status-button[data-status="future-work"] { color: var(--future-work); background: var(--future-work-soft); }

    .phase-controls, .priority-controls {
      display: flex;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
    }

    .phase-button {
      min-width: 70px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      color: var(--muted);
      background: transparent;
      box-shadow: none;
    }

    .phase-button:last-child { border-right: 0; }
    .phase-button[data-phase="1"].is-active { color: var(--phase-1); background: var(--phase-1-soft); }
    .phase-button[data-phase="2"].is-active { color: var(--phase-2); background: var(--phase-2-soft); }
    .phase-button[data-phase="3"].is-active { color: var(--phase-3); background: var(--phase-3-soft); }

    .priority-button {
      min-width: 68px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      color: var(--muted);
      background: transparent;
      box-shadow: none;
    }

    .priority-button:last-child { border-right: 0; }
    .priority-button[data-priority="low"].is-active { color: var(--priority-low); background: var(--priority-low-soft); }
    .priority-button[data-priority="medium"].is-active { color: var(--priority-medium); background: var(--priority-medium-soft); }
    .priority-button[data-priority="high"].is-active { color: var(--priority-high); background: var(--priority-high-soft); }

    .keyboard-help {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 10px;
      color: var(--muted);
      font-size: .78rem;
    }

    kbd {
      display: inline-block;
      min-width: 1.65em;
      margin-right: 4px;
      padding: 1px 5px;
      border: 1px solid #c7cec8;
      border-bottom-width: 2px;
      border-radius: 4px;
      color: #344139;
      background: #fff;
      font: 700 .72rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 34px auto 72px;
    }

    .review-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: .84rem;
    }

    .resource-details {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px 14px;
    }

    .resource-details > span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .resource-link {
      flex: none;
      color: var(--accent);
      font-weight: 750;
      text-decoration-thickness: .08em;
      text-underline-offset: .16em;
    }

    .resource-link:hover { color: #0e4432; }
    .resource-link:focus-visible {
      border-radius: 3px;
      outline: 3px solid rgba(23, 92, 69, .24);
      outline-offset: 3px;
    }

    .review-summary { display: grid; gap: 2px; text-align: right; }
    .status-summary span, .phase-summary span, .priority-summary span { white-space: nowrap; }

    .report {
      position: relative;
      min-height: 65vh;
      padding: clamp(28px, 5vw, 68px);
      overflow: hidden;
      border: 1px solid rgba(24, 33, 28, .11);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .report::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: var(--status-color, var(--approved));
    }

    .report[data-status="approved"] { --status-color: var(--approved); }
    .report[data-status="rejected"] { --status-color: var(--rejected); }
    .report[data-status="uncertain"] { --status-color: var(--uncertain); }
    .report[data-status="future-work"] { --status-color: var(--future-work); }

    .report h1, .report h2, .report h3 {
      color: #17241d;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.2;
    }

    .report h1 {
      max-width: 18em;
      margin: 0 0 1.2em;
      font-size: clamp(2rem, 5vw, 3.45rem);
      font-weight: 650;
      letter-spacing: -.035em;
    }

    .report h2 {
      margin: 2.25em 0 .7em;
      padding-bottom: .34em;
      border-bottom: 1px solid var(--line);
      font-size: 1.5rem;
    }

    .report h3 { margin: 1.7em 0 .5em; font-size: 1.14rem; }
    .report p, .report li { max-width: 78ch; }
    .report strong { color: #263a2f; }
    .report a { color: var(--accent); text-decoration-thickness: .08em; text-underline-offset: .16em; }
    .report code { padding: .12em .32em; border-radius: 4px; background: #edf0eb; font-size: .88em; }
    .report pre { padding: 18px; overflow: auto; border-radius: 8px; background: #1f2823; color: #edf4ef; }
    .report pre code { padding: 0; background: transparent; }
    .report blockquote { margin-left: 0; padding-left: 18px; border-left: 4px solid var(--accent-soft); color: #506059; }

    .report table {
      display: table;
      width: 100%;
      margin: 1.15em 0 1.75em;
      border-spacing: 0;
      border-collapse: separate;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      font-size: .91rem;
    }

    .report th, .report td {
      padding: 10px 12px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .report th:last-child, .report td:last-child { border-right: 0; }
    .report tr:last-child td { border-bottom: 0; }
    .report th { color: #2c4638; background: #edf3ee; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
    .report tbody tr:nth-child(even) { background: rgba(236, 240, 235, .48); }
    .empty-state { padding: 80px 20px; text-align: center; color: var(--muted); }

    @media (min-width: 761px) and (max-width: 1180px) {
      .toolbar { grid-template-columns: auto minmax(220px, 1fr) auto auto; }
      #previous { grid-column: 1; grid-row: 1; }
      #report-picker { grid-column: 2; grid-row: 1; }
      #sort-order { grid-column: 3; grid-row: 1; }
      #next { grid-column: 4; grid-row: 1; }
      .phase-controls { grid-column: 1; grid-row: 2; }
      .priority-controls { grid-column: 2; grid-row: 2; justify-self: start; }
      .status-button { grid-column: 3 / 5; grid-row: 2; }
    }

    @media (max-width: 760px) {
      .masthead { align-items: flex-start; }
      .brand { display: grid; gap: 4px; }
      .collection-tabs { width: 100%; }
      .collection-tab { flex: 1; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      #report-picker { grid-column: 1 / -1; grid-row: 1; }
      #sort-order { grid-column: 1 / -1; grid-row: 2; }
      .phase-controls { grid-column: 1 / -1; grid-row: 3; }
      .phase-button, .priority-button { flex: 1; }
      .priority-controls { grid-column: 1 / -1; grid-row: 4; }
      #previous { grid-column: 1; grid-row: 5; }
      #next { grid-column: 2; grid-row: 5; }
      .status-button { grid-column: 1 / -1; grid-row: 6; min-width: 0; }
      .keyboard-help { display: none; }
      main { margin-top: 20px; }
      .review-strip { align-items: flex-start; flex-direction: column; gap: 4px; }
      .resource-details { align-items: flex-start; flex-direction: column; gap: 2px; }
      .resource-details > span { white-space: normal; }
      .review-summary { text-align: left; }
      .report { padding: 28px 20px 40px; border-radius: 10px; }
      .report table { display: block; overflow-x: auto; }
    }

    @media print {
      body { background: #fff; }
      .app-header, .review-strip { display: none; }
      main { width: 100%; margin: 0; }
      .report { padding: 0; border: 0; box-shadow: none; }
      .report::before { display: none; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="masthead">
        <div class="brand"><strong>VALA</strong><span>Literature summary reports</span></div>
        <div class="counter" id="counter" aria-live="polite"></div>
      </div>
      <div class="collection-tabs" role="tablist" aria-label="Report collection">
        <button class="collection-tab is-active" id="tab-literature" data-collection="literature" type="button" role="tab" aria-selected="true">Literature</button>
        <button class="collection-tab" id="tab-reference" data-collection="reference" type="button" role="tab" aria-selected="false">Reference material</button>
      </div>
      <div class="toolbar" aria-label="Report controls">
        <button class="nav-button" id="previous" type="button" aria-label="Previous report">← Previous</button>
        <select id="report-picker" aria-label="Select a report"></select>
        <select class="sort-order" id="sort-order" aria-label="Sort reports">
          <option value="index">Index order</option>
          <option value="date-desc">Date: newest first</option>
          <option value="date-asc">Date: oldest first</option>
        </select>
        <div class="phase-controls" aria-label="Implementation phase" role="group">
          <button class="phase-button" data-phase="1" type="button" title="Phase 1: immediate relevance">Phase 1</button>
          <button class="phase-button" data-phase="2" type="button" title="Phase 2: supporting relevance">Phase 2</button>
          <button class="phase-button" data-phase="3" type="button" title="Phase 3: later or reference work">Phase 3</button>
        </div>
        <div class="priority-controls" aria-label="Report priority" role="group">
          <button class="priority-button" data-priority="low" type="button" title="Low priority (L)">Low</button>
          <button class="priority-button" data-priority="medium" type="button" title="Medium priority (M)">Medium</button>
          <button class="priority-button" data-priority="high" type="button" title="High priority (H)">High</button>
        </div>
        <button class="status-button" id="status" type="button" aria-label="Change review status"></button>
        <button class="nav-button" id="next" type="button" aria-label="Next report">Next →</button>
      </div>
      <div class="keyboard-help" aria-label="Keyboard shortcuts">
        <span><kbd>←</kbd>previous report</span>
        <span><kbd>→</kbd>next report</span>
        <span><kbd>Space</kbd>change status</span>
        <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>assign implementation phase</span>
        <span><kbd>L</kbd><kbd>M</kbd><kbd>H</kbd>assign priority</span>
        <span>Status order: Approved → Rejected → Uncertain → Future work</span>
      </div>
    </div>
  </header>

  <main>
    <div class="review-strip">
      <div class="resource-details">
        <span id="report-meta"></span>
        <a class="resource-link" id="resource-link" href="#" target="_blank" rel="noreferrer"></a>
      </div>
      <div class="review-summary">
        <span class="phase-summary" id="phase-summary"></span>
        <span class="priority-summary" id="priority-summary"></span>
        <span class="status-summary" id="status-summary"></span>
      </div>
    </div>
    <article class="report" id="report" tabindex="-1"></article>
  </main>

        history.replaceState(null, "", `#${encodeURIComponent(report.id)}`);
        updateStatusSummary();

        if (options.scroll !== false) {
          window.scrollTo({ top: 0, behavior: options.instant ? "auto" : "smooth" });
        }
      }

      function navigate(offset) {
        currentIndex = (currentIndex + offset + orderedReports.length) % orderedReports.length;
        render();
      }

      function setCurrent(index) {
        if (!Number.isInteger(index) || index < 0 || index >= orderedReports.length) return;
        currentIndex = index;
        render();
      }

      function cycleStatus() {
        if (!reports.length) return;
        const report = orderedReports[currentIndex];
        const current = statusFor(report);
        const next = statusOrder[(statusOrder.indexOf(current) + 1) % statusOrder.length];
        statuses[report.id] = next;
        saveStatuses();
        render({ scroll: false });
      }

      function assignPhase(phase) {
        if (!reports.length || !phaseOrder.includes(phase)) return;
        phases[orderedReports[currentIndex].id] = phase;
        savePhases();
        render({ scroll: false });
      }

      function assignPriority(priority) {
        if (!reports.length || !priorityOrder.includes(priority)) return;
        priorities[orderedReports[currentIndex].id] = priority;
        savePriorities();
        render({ scroll: false });
      }

      function isEditable(target) {
        return target instanceof HTMLElement && (
          target.isContentEditable ||
          target.matches("input, textarea, select, option")
        );
      }

      document.getElementById("previous").addEventListener("click", () => navigate(-1));
      document.getElementById("next").addEventListener("click", () => navigate(1));
      statusButton.addEventListener("click", cycleStatus);
      phaseButtons.forEach(button => {
        button.addEventListener("click", () => assignPhase(button.dataset.phase));
      });
      priorityButtons.forEach(button => {
        button.addEventListener("click", () => assignPriority(button.dataset.priority));
      });
      collectionTabs.forEach(tab => {
        tab.addEventListener("click", () => activateCollection(tab.dataset.collection));
      });
      picker.addEventListener("change", event => setCurrent(Number(event.target.value)));
      sortPicker.addEventListener("change", event => applySort(event.target.value));
      window.addEventListener("hashchange", () => {
        const hashCollection = collectionFromHash();
        if (hashCollection && hashCollection !== activeCollection) {
          activateCollection(hashCollection, { useHash: true });
          return;
        }
        const index = indexFromHash();
        if (index !== currentIndex) {
          currentIndex = index;
          render();
        }
      });
      document.addEventListener("keydown", event => {
        if (isEditable(event.target) || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          navigate(-1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          navigate(1);
        } else if (event.code === "Space") {
          event.preventDefault();
          cycleStatus();
        } else if (phaseOrder.includes(event.key)) {
          event.preventDefault();
          assignPhase(event.key);
        } else if (Object.hasOwn(priorityKeys, event.key.toLowerCase())) {
          event.preventDefault();
          assignPriority(priorityKeys[event.key.toLowerCase()]);
        }
      });

      sortPicker.value = sortOrder;
      const initialHashCollection = collectionFromHash();
      activateCollection(initialHashCollection || activeCollection, {
        useHash: Boolean(initialHashCollection),
        scroll: false
      });
    })();
  </script>
</body>
</html>
